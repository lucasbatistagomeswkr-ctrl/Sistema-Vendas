<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	
    <title>Sistema de Vendas</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
		<img src="https://w7.pngwing.com/pngs/786/126/png-transparent-logo-contracting-photography-logo-symbol.png" width="30" height="30" class="d-inline-block align-top" style="margin-right: 8px;" alt="">
        <a class="navbar-brand" href="#">Sistema de Vendas</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0">
                <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Pesquisar</button>
            </form>
        </div>
    </nav>

	
	<!--Campos-->
    <div class="container">
		
        <form th:action="@{/salvarCliente}" th:object="${cliente}" method="POST">
            
            <div class="form-group">
				<div class="row">
				
					<div class="col">
						<label for="id">ID:</label>
                		<input type="text" readonly="readonly" class="form-control" id="id" th:field="*{id}">					
					</div>
									
					<div class="col">
						<label for="nome">Nome Cliente:</label>
                		<input type="text" required class="form-control" th:field="*{nome}">					
					</div>
				
					<div class="col">
						<label for="nome">CPF:</label>
						<input type="text" id="cpf" required class="form-control" th:field="*{cpf}">	
					</div>
					
				</div>	
			</div>
			
			
			<div class="form-group">
				<div class="row">
				
					<div class="col-md">
						<label for="nome">Telefone:</label>
						<input type="text" id="telefone" required class="form-control" th:field="*{telefone}">		
					</div>
									
					<div class="col-md">
						<label for="nome">Endereço:</label>
						<input type="text" required class="form-control" id="nome" th:field="*{endereco}">	
					</div>
				
					<div class="col-md">
						<label for="nome">Número:</label>
						<input type="text" required class="form-control" id="nome" th:field="*{numero}">
					</div>
					
				</div>	
			</div>
			
			
			<div class="form-group">
				<div class="row">
				
					<div class="col-md">
						<label for="nome">Bairro:</label>
						<input type="text" required class="form-control" th:field="*{bairro}">
					</div>	
						
								
					<div class="col-md">
						<label for="nome">Email:</label>
						<input type="text" required class="form-control" th:field="*{email}">
					</div>
				
					
					<div class="col-md">
						 <label for="cidade">Cidade:</label>
			   			 <select th:field="*{cidade}" id="cidade" class="form-control">
			       		 <option th:each="est : ${listaCidades}" th:value="${est.id}" th:text="${est.nome}"></option>
			    		 </select>
					</div>
				</div>
				
				
				
				
				
				
				
			    
			</div>

            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk" style="color: rgb(255, 255, 255);"></i> Salvar</button>
            <a href="/administrativo" class="btn btn-danger"> <i class="fa-solid fa-right-to-bracket" style="color: rgb(255, 255, 255);"></i> Voltar</a>
			<a href="/listarCliente" class="btn btn-success"><i class="fa-solid fa-list" style="color: rgb(255, 255, 255);"></i> Listar</a>


       

    <!-- Optional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/0.9.0/jquery.mask.min.js" integrity="sha512-oJCa6FS2+zO3EitUSj+xeiEN9UTr+AjqlBZO58OPadb2RfqwxHpjTU8ckIC8F4nKvom7iru2s8Jwdo+Z8zm0Vg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	
	<script>
		$(document).ready(function(){
		  $('#cpf').mask('999.999.999-99');
		  $('#telefone').mask('(99) 9 9999-9999');
		  });
	</script>

</body>
</html>
